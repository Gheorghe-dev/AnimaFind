name: Release Pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Set Android SDK Environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

      - name: Build Web Static Export & Sync Capacitor
        run: npm run build:mobile

      - name: Make Gradle Wrapper Executable
        run: chmod +x android/gradlew

      - name: Build Android Release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Stage Release Artifact
        run: |
          mkdir -p release-artifacts
          cp $(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1) release-artifacts/AnimaFind-${{ github.ref_name }}.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: release-artifacts/AnimaFind-${{ github.ref_name }}.apk

  build-ios:
    name: Build Release IPA
    runs-on: macos-13
    continue-on-error: true
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Select Latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Test Suite
        run: npm test

      - name: Build Web Static Export & Sync Capacitor
        run: npm run build:mobile

      - name: Build iOS Device App (Unsigned IPA)
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build_device \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package iOS IPA Archive
        run: |
          mkdir -p release-artifacts/Payload
          cp -R ios/App/build_device/Build/Products/Release-iphoneos/App.app release-artifacts/Payload/
          cd release-artifacts && zip -r AnimaFind-${{ github.ref_name }}.ipa Payload
          rm -rf Payload

      - name: Upload Release IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-ipa
          path: release-artifacts/AnimaFind-${{ github.ref_name }}.ipa

  publish-release:
    name: Create GitHub Release
    needs: [build-android, build-ios]
    if: always() && needs.build-android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Download Built APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: release-artifacts

      - name: Download Built IPA
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: release-ipa
          path: release-artifacts

      - name: List Release Files
        run: ls -la release-artifacts

      - name: Generate Release Notes & Publish
        uses: softprops/action-gh-release@v2
        with:
          name: AnimaFind Release ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            release-artifacts/*.apk
            release-artifacts/*.ipa
